# java.util.logging configuration for test runs; the :test alias points
# -Djava.util.logging.config.file at this file. Naming a file replaces the
# JDK's own logging.properties, so the console handler is declared here too.

handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO

# Migratus logs six INFO lines per migration, and every test that migrates a
# temporary database would print them. Warnings and errors still show.
migratus.level = WARNING

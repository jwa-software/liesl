# slf4j-simple configuration for test runs; it reads this file from the
# classpath root, and `test` is on the classpath only under the :test alias.
#
# Migratus logs through clojure.tools.logging, which uses slf4j as soon as an
# implementation is present. slf4j-simple is present for the MCP server, so
# Migratus no longer falls back to java.util.logging and logging.properties
# no longer silences it. Six INFO lines per migration, times every test that
# migrates a temporary database, is what this line keeps out.
org.slf4j.simpleLogger.log.migratus=warn

# The MCP SDK logs every client handshake at INFO, and its input validator
# logs a refused call at WARN. The tests start a server nine times and refuse
# one call on purpose, so both stay out; the SDK's errors still show.
org.slf4j.simpleLogger.log.io.modelcontextprotocol=warn
org.slf4j.simpleLogger.log.io.modelcontextprotocol.util.ToolInputValidator=error
